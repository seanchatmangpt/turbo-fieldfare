[project]
name = "kcj-mustar"
version = "0.1.0"
description = "KCJ Multi-Lingual MuStar League with Vendored DSPy Engines, OPQL, Rust4PM, OpenAgentTraces, scikit-decide, and TPOT"
authors = [
    { name = "seanchatmangpt", email = "seanchatmangpt@gmail.com" }
]
dependencies = [
    "blake3>=1.0.0",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pm4py>=2.7.0",
    "pandas>=2.0.0",
    "antlr4-python3-runtime>=4.13.1",
    "dspy",
    "opql",
    "r4pm",
    "open-agent-traces",
    "tpot",
]
requires-python = ">=3.11"

[tool.uv.sources]
dspy = { path = "vendors/dspy", editable = true }
opql = { path = "vendors/opql", editable = true }
r4pm = { path = "vendors/r4pm", editable = true }
open-agent-traces = { path = "vendors/open_agent_traces", editable = true }
tpot = { path = "vendors/tpot2", editable = true }

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "vendors/dspy",
    "vendors/opql",
    "vendors/r4pm",
    "vendors/open_agent_traces",
    "vendors/tpot2",
    "vendors/scikit_decide/src"
]
